[profile.default]
src = "src"
test = "test/foundry"
# Separate from Hardhat's cache/ + artifacts/ and the CLI's out/.
out = "forge-out"
cache_path = "cache_forge"
libs = ["lib", "node_modules"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true

remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 512
