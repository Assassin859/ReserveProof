name: Ops epoch

# Re-publish every liability book and record fresh reserve samples well inside the
# 7-day maxOracleAge, so the testnet oracles never go STALE.
on:
  schedule:
    - cron: "0 2 */3 * *"
  workflow_dispatch:

jobs:
  publish:
    name: ${{ matrix.network }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        network: [robinhoodTestnet, arbitrumSepolia]
    # Shared with the watchtower so the two never send transactions from the deployer key at once.
    concurrency:
      group: deployer-${{ matrix.network }}
      cancel-in-progress: false
    env:
      DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
      DEPLOYMENT_SALT: ${{ secrets.DEPLOYMENT_SALT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check secrets
        run: |
          if [ -z "$DEPLOYER_PRIVATE_KEY" ]; then
            echo "::error::Add the DEPLOYER_PRIVATE_KEY repository secret"; exit 1
          fi
      - run: npx hardhat run scripts/ops-cycle.ts --network ${{ matrix.network }}
      - run: npx hardhat run scripts/status.ts --network ${{ matrix.network }}

  # Robinhood Chain mainnet (real USDG / TSLA). Uses a separate key and is skipped until the
  # MAINNET_PRIVATE_KEY repository secret exists.
  mainnet:
    name: robinhoodMainnet
    runs-on: ubuntu-latest
    env:
      MAINNET_PRIVATE_KEY: ${{ secrets.MAINNET_PRIVATE_KEY }}
    steps:
      - id: gate
        run: echo "enabled=${{ env.MAINNET_PRIVATE_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.gate.outputs.enabled == 'true'
        run: npm ci
      - if: steps.gate.outputs.enabled == 'true'
        run: npx hardhat run scripts/ops-cycle.ts --network robinhoodMainnet
      - if: steps.gate.outputs.enabled == 'true'
        run: npx hardhat run scripts/status.ts --network robinhoodMainnet
